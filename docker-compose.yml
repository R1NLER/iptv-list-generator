services:
  lista-m3u:
    build: .
    container_name: lista-m3u
    restart: unless-stopped
    environment:
      - TZ=Europe/Madrid
    env_file:
      - .env
    ports:
      - "80:80"
    depends_on:
      - ipfs
    volumes:
      - emergency-data:/app/data

  ipfs:
    image: ipfs/kubo:release
    container_name: ipfs
    restart: unless-stopped
    environment:
      - TZ=Europe/Madrid
    ports:
      - "8081:8080" # Exponer gateway IPFS en el host como 8081
    volumes:
      - ipfs-data:/data/ipfs

volumes:
  ipfs-data:
  emergency-data:
