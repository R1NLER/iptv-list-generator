events {}

http {
    server {
        listen 80;

        location /manual {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            root /htdocs;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
        }
    }
}